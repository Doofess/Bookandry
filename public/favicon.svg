<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Favicon variant: corner marks removed and the portrait enlarged, because at
       16px the master's 0.9-unit marks render at ~0.6 device px and vanish. -->
  <style>
    .bg { fill: #0F3A8A; }
    .paper { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #56A0FF; }
      .paper { fill: #0b0b0d; }
    }
  </style>
  <circle class="bg" cx="12" cy="12" r="12" />
  <rect class="paper" x="4" y="7.5" width="16" height="9" rx="1.6" />
  <circle class="bg" cx="12" cy="12" r="2.4" />
</svg>
